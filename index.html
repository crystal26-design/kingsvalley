<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>帝王谷·智能语音讲解</title>
<style>
    :root {
        --gold: #d4af37;
        --dark: #14100b;
        --dark2: #1e1810;
        --sand: #f4eae1;
        --line: rgba(212, 175, 55, 0.28);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--dark); color: #fff;
    }
    body { display: flex; flex-direction: column; }

    header {
        flex: 0 0 auto;
        background: rgba(0, 0, 0, 0.9);
        text-align: center;
        padding: 10px 0 8px;
        border-bottom: 2px solid var(--gold);
    }
    header .title { font-size: 1rem; font-weight: bold; color: var(--gold); letter-spacing: 2px; }
    header .sub { font-size: 0.68rem; color: rgba(244, 234, 225, 0.55); letter-spacing: 1px; margin-top: 3px; }

    #main { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 90px; }

    .intro-note {
        font-size: 0.72rem;
        line-height: 1.6;
        color: rgba(244,234,225,0.5);
        border-left: 2px solid var(--line);
        padding: 2px 0 2px 10px;
        margin-bottom: 14px;
    }

    .zone-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(212,175,55,0.07), rgba(212,175,55,0.02));
        margin-bottom: 12px;
        overflow: hidden;
    }
    .zone-head { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; user-select: none; }
    .zone-badge {
        flex: 0 0 auto;
        width: 46px; height: 46px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(212,175,55,0.08);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        color: var(--gold);
    }
    .zone-badge .kv { font-size: 0.72rem; font-weight: bold; letter-spacing: 0.5px; }
    .zone-badge .idx { font-size: 0.55rem; color: rgba(212,175,55,0.55); margin-top: 1px; }
    .zone-name { flex: 1; font-size: 0.92rem; font-weight: bold; color: var(--sand); line-height: 1.3; min-width: 0; }
    .zone-name .en {
        display: block; font-size: 0.6rem; font-weight: normal; color: rgba(244,234,225,0.4);
        letter-spacing: 0.5px; margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .zone-count {
        flex: 0 0 auto; font-size: 0.66rem; color: var(--gold);
        border: 1px solid var(--line); border-radius: 10px; padding: 2px 7px; margin-right: 2px;
    }
    .zone-arrow { flex: 0 0 auto; color: var(--gold); font-size: 0.72rem; transition: transform 0.25s; }
    .zone-card.open .zone-arrow { transform: rotate(90deg); }

    .zone-play {
        flex: 0 0 auto; background: transparent; border: 1px solid var(--gold); color: var(--gold);
        border-radius: 14px; font-size: 0.68rem; padding: 4px 9px; cursor: pointer;
        font-family: inherit; white-space: nowrap;
    }
    .zone-play:active { background: rgba(212,175,55,0.18); }

    .zone-items { display: none; border-top: 1px solid var(--line); background: rgba(0,0,0,0.25); }
    .zone-card.open .zone-items { display: block; }

    .item-row {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid rgba(212,175,55,0.1);
        cursor: pointer;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:active { background: rgba(212,175,55,0.1); }
    .item-no {
        flex: 0 0 auto; width: 24px;
        font-size: 0.7rem; color: var(--gold); font-weight: bold; text-align: center;
    }
    .item-text { flex: 1; min-width: 0; }
    .item-name { font-size: 0.85rem; color: var(--sand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub {
        font-size: 0.66rem; color: rgba(244,234,225,0.42); margin-top: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-audio {
        flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%;
        border: 1px solid var(--gold); display: flex; justify-content: center; align-items: center;
        font-size: 0.62rem; color: var(--gold);
    }

    #map-zoom {
        position: fixed; inset: 0; background: rgba(0,0,0,0.94); z-index: 9700;
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s;
    }
    #map-zoom.show { opacity: 1; visibility: visible; }
    #map-zoom img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
    #map-zoom .zoom-close {
        position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
        border: 1px solid var(--gold); background: rgba(0,0,0,0.6); color: var(--gold);
        font-size: 18px; line-height: 1; display: flex; justify-content: center; align-items: center; cursor: pointer;
    }

    #detail-modal {
        position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9000;
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden; transition: opacity 0.25s, visibility 0.25s; padding: 16px;
    }
    #detail-modal.show { opacity: 1; visibility: visible; }

    .detail-card {
        width: 100%; max-width: 460px; max-height: 88vh;
        background: var(--dark2); border: 1px solid var(--gold); border-radius: 14px;
        display: flex; flex-direction: column; overflow: hidden;
        transform: scale(0.94); transition: transform 0.25s;
        box-shadow: 0 0 50px rgba(212,175,55,0.35);
    }
    #detail-modal.show .detail-card { transform: scale(1); }

    .detail-head {
        flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
        padding: 12px 14px; border-bottom: 1px solid var(--line); background: rgba(0,0,0,0.35);
    }
    .detail-badge { flex: 0 0 auto; font-size: 0.64rem; color: var(--gold); border: 1px solid var(--gold); border-radius: 10px; padding: 2px 8px; }
    .detail-title { flex: 1; font-size: 0.92rem; font-weight: bold; color: var(--sand); line-height: 1.3; }
    .detail-close {
        flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
        border: 1px solid var(--gold); background: transparent; color: var(--gold);
        font-size: 16px; line-height: 1; cursor: pointer;
        display: flex; justify-content: center; align-items: center;
    }

    .detail-body { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .detail-photo {
        width: 100%; aspect-ratio: 4 / 3; background: #0e0b07;
        display: flex; justify-content: center; align-items: center; overflow: hidden;
        border-bottom: 1px solid var(--line); position: relative;
    }
    .detail-photo img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
    .photo-placeholder {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px;
        color: rgba(212,175,55,0.5); font-size: 0.74rem;
        background: repeating-linear-gradient(45deg, rgba(212,175,55,0.05) 0 14px, transparent 14px 28px);
        text-align: center; padding: 0 24px;
    }
    .photo-placeholder .big { font-size: 2rem; opacity: 0.75; }
    .photo-placeholder .path { font-size: 0.62rem; color: rgba(212,175,55,0.35); font-family: ui-monospace, monospace; }

    .audio-bar {
        padding: 12px 15px; display: flex; align-items: center; gap: 12px;
        background: rgba(212,175,55,0.06); border-bottom: 1px solid var(--line);
    }
    .play-btn {
        flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
        background: var(--gold); border: none; color: var(--dark);
        font-size: 1.05rem; font-weight: bold; cursor: pointer;
        display: flex; justify-content: center; align-items: center;
    }
    .play-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    .audio-meta { flex: 1; min-width: 0; }
    .audio-label {
        font-size: 0.7rem; color: var(--gold);
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .speed-btn {
        background: transparent; border: 1px solid var(--gold); color: var(--gold);
        border-radius: 10px; font-size: 0.66rem; padding: 1px 8px; cursor: pointer; font-family: inherit;
    }
    .audio-track { height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; cursor: pointer; }
    .audio-progress { height: 100%; width: 0%; background: var(--gold); border-radius: 2px; transition: width 0.15s linear; }

    .detail-desc {
        padding: 13px 15px 20px; font-size: 0.84rem; line-height: 1.75;
        color: rgba(244,234,225,0.82);
    }
    .detail-desc p { margin: 0 0 10px; }
    .detail-desc p:last-child { margin-bottom: 0; }

    footer {
        flex: 0 0 auto; text-align: center; padding: 6px 0 8px;
        font-size: 0.6rem; color: rgba(244,234,225,0.28);
        border-top: 1px solid rgba(212,175,55,0.12);
    }
    #ai-fab {
        position: fixed;
        right: 16px; bottom: 20px;
        width: 54px; height: 54px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #f0d67a, var(--gold) 65%);
        border: 2px solid #fff;
        box-shadow: 0 4px 20px rgba(212,175,55,0.55);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        cursor: pointer;
        z-index: 9500;
        color: var(--dark);
        transition: transform 0.2s;
    }
    #ai-fab:active { transform: scale(0.92); }
    #ai-fab .ico { font-size: 1.35rem; line-height: 1; }
    #ai-fab .txt { font-size: 0.55rem; font-weight: bold; letter-spacing: 1px; margin-top: 1px; }

    #ai-panel {
        position: fixed;
        right: 12px; bottom: 12px;
        width: calc(100% - 24px);
        max-width: 400px;
        height: min(70vh, 520px);
        background: var(--dark2);
        border: 1px solid var(--gold);
        border-radius: 14px;
        box-shadow: 0 10px 50px rgba(0,0,0,0.75);
        z-index: 9600;
        display: flex; flex-direction: column;
        overflow: hidden;
        transform: translateY(16px) scale(0.96);
        opacity: 0; visibility: hidden;
        transition: all 0.25s ease;
    }
    #ai-panel.show { transform: none; opacity: 1; visibility: visible; }

    .ai-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        padding: 11px 14px;
        background: rgba(0,0,0,0.4);
        border-bottom: 1px solid var(--line);
        font-size: 0.9rem; font-weight: bold; color: var(--gold);
    }
    .ai-head .close {
        width: 26px; height: 26px; border-radius: 50%;
        border: 1px solid var(--gold); background: transparent;
        color: var(--gold); font-size: 15px; line-height: 1;
        cursor: pointer;
        display: flex; justify-content: center; align-items: center;
    }
    .ai-context {
        flex: 0 0 auto;
        font-size: 0.68rem;
        color: rgba(244,234,225,0.5);
        padding: 6px 14px;
        border-bottom: 1px solid rgba(212,175,55,0.12);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ai-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 12px 14px;
        font-size: 0.85rem;
        line-height: 1.6;
        color: #ddd;
        -webkit-overflow-scrolling: touch;
    }
    .ai-body .msg { margin-bottom: 10px; }
    .ai-body .msg.user { text-align: right; }
    .ai-body .msg.user span {
        display: inline-block;
        background: rgba(212,175,55,0.18);
        border: 1px solid var(--line);
        border-radius: 10px 10px 2px 10px;
        padding: 7px 11px;
        max-width: 85%;
        color: var(--sand);
        text-align: left;
    }
    .ai-body .msg.ai span {
        display: inline-block;
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(212,175,55,0.18);
        border-radius: 10px 10px 10px 2px;
        padding: 7px 11px;
        max-width: 92%;
    }
    .ai-input-wrap {
        flex: 0 0 auto;
        display: flex; gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: rgba(0,0,0,0.3);
    }
    .ai-input-wrap input {
        flex: 1;
        background: #2b231a;
        border: 1px solid var(--gold);
        border-radius: 20px;
        padding: 8px 14px;
        color: #fff; outline: none;
        font-size: 0.85rem;
        font-family: inherit;
    }
    .ai-input-wrap button {
        flex: 0 0 auto;
        background: var(--gold); border: none;
        color: var(--dark);
        border-radius: 20px;
        padding: 8px 18px;
        font-weight: bold; font-size: 0.85rem;
        cursor: pointer;
        font-family: inherit;
    }
    .ai-input-wrap button:disabled { background: #555; color: #888; }

</style>
</head>
<body>
<script src="./invite-auth.js"></script>

<header>
    <div class="title">🏛 帝王谷·智能语音讲解</div>
    <div class="sub">VALLEY OF THE KINGS · AUDIO GUIDE</div>
</header>

<div id="main">
    <div class="intro-note">
        点开任意一座墓，可听到该墓穴概况讲解；展开后是按行走顺序排列的墓中点位讲解。安静环境中，建议搭配耳机。
    </div>
    <div id="view-list"></div>
</div>

<footer>共 9 座墓 · 26 处点位 · 35 条音频</footer>

<!-- 图片放大 -->
<div id="map-zoom" onclick="if(event.target===this) closeMapZoom()">
    <button class="zoom-close" onclick="closeMapZoom()">&times;</button>
    <img id="map-zoom-img" src="" alt="图片放大">
</div>

<!-- 讲解弹层 -->
<div id="detail-modal" onclick="if(event.target===this) closeDetail()">
    <div class="detail-card">
        <div class="detail-head">
            <span class="detail-badge" id="detail-badge">墓穴</span>
            <div class="detail-title" id="detail-title">标题</div>
            <button class="detail-close" onclick="closeDetail()">&times;</button>
        </div>
        <div class="detail-body">
            <div class="detail-photo">
                <img id="detail-img" src="" alt="" style="display:none" onclick="openMapZoom(this.src)">
                <div class="photo-placeholder" id="detail-photo-ph">
                    <div class="big">🖼</div>
                    <div id="detail-photo-ph-text">以现场实景为准</div>
                    <div class="path" id="detail-photo-ph-path"></div>
                </div>
            </div>
            <div class="audio-bar">
                <button class="play-btn" id="play-btn" onclick="toggleAudio()">▶</button>
                <div class="audio-meta">
                    <div class="audio-label">
                        <span>语音讲解</span>
                        <span style="display:flex;gap:6px;align-items:center;">
                            <button class="speed-btn" id="speed-btn" onclick="cycleSpeed(event)">1.0x</button>
                            <span id="audio-time">00:00 / 00:00</span>
                        </span>
                    </div>
                    <div class="audio-track" onclick="seekAudio(event)">
                        <div class="audio-progress" id="audio-progress"></div>
                    </div>
                </div>
            </div>
            <div class="detail-desc" id="detail-desc"></div>
        </div>
    </div>
</div>

<audio id="global-player" preload="metadata"></audio>

<!-- AI 悬浮球 -->
<div id="ai-fab" onclick="toggleAiPanel()">
    <div class="ico">🔮</div>
    <div class="txt">法老密示</div>
</div>

<!-- AI 对话面板 -->
<div id="ai-panel">
    <div class="ai-head">
        <span>🔮 法老密示</span>
        <button class="close" onclick="toggleAiPanel(false)">&times;</button>
    </div>
    <div class="ai-context" id="ai-context">当前浏览：导览首页</div>
    <div class="ai-body" id="ai-body">
        <div class="msg ai"><span>游客，点开任意一座墓即可聆听讲解。若有关于帝王谷、法老或来世信仰的疑问，尽管在此向我发问……</span></div>
    </div>
    <div class="ai-input-wrap">
        <input type="text" id="user-question" placeholder="向埃及考古讲解员提问..."
               onkeypress="handleKeyPress(event)">
        <button onclick="askPharaoh()" id="ask-btn">提问</button>
    </div>
</div>

<script src="data.js"></script>
<script>
/* ============ 渲染逻辑 ============ */
const viewList = document.getElementById('view-list');

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function kvCode(name) {
    const m = name.match(/^(KV\d+|QV\d+)/);
    return m ? m[1] : '';
}
function nameWithoutCode(name) {
    return name.replace(/^(KV\d+|QV\d+)\s*·\s*/, '');
}

function renderList() {
    viewList.innerHTML = ZONES.map((z, zi) => {
        const code = kvCode(z.name);
        const label = code || '总览';
        const idxText = z.spots.length ? (z.spots.length + ' 处') : '';

        const rows = z.spots.map(s => `
            <div class="item-row" onclick="openSpot('${z.id}', ${s.no})">
                <div class="item-no">${String(s.no).padStart(2, '0')}</div>
                <div class="item-text">
                    <div class="item-name">${esc(s.name)}</div>
                    <div class="item-sub">${esc(s.nameEn || '')}</div>
                </div>
                <div class="item-audio">▶</div>
            </div>
        `).join('');

        return `
        <div class="zone-card" id="zc-${z.id}">
            <div class="zone-head" onclick="toggleZone('${z.id}')">
                <div class="zone-badge">
                    <span class="kv">${esc(label)}</span>
                    <span class="idx">${esc(z.tag)}</span>
                </div>
                <div class="zone-name">
                    ${esc(nameWithoutCode(z.name))}
                    <span class="en">${esc(z.nameEn)}</span>
                </div>
                ${idxText ? `<div class="zone-count">${idxText}</div>` : ''}
                <button class="zone-play" onclick="event.stopPropagation(); openZone('${z.id}')">▶ 概况</button>
                <div class="zone-arrow">▶</div>
            </div>
            ${z.spots.length ? `<div class="zone-items">${rows}</div>` : ''}
        </div>`;
    }).join('');
}

function toggleZone(id) {
    const card = document.getElementById('zc-' + id);
    if (!card || !card.querySelector('.zone-items')) return;
    const willOpen = !card.classList.contains('open');
    document.querySelectorAll('.zone-card').forEach(c => c.classList.remove('open'));
    if (willOpen) card.classList.add('open');
}

/* ---- 弹窗 ---- */
function openZone(id) {
    const z = ZONES.find(x => x.id === id);
    if (!z) return;
    currentContext = `墓穴：${z.name}`;
    updateAiContext();
    showDetail({
        badge: z.tag || '墓穴',
        title: z.name,
        img: z.img,
        audio: z.audio,
        desc: z.desc
    });
}

function openSpot(zoneId, no) {
    const z = ZONES.find(x => x.id === zoneId);
    if (!z) return;
    const s = z.spots.find(x => x.no === Number(no));
    if (!s) return;
    currentContext = `点位 ${String(s.no).padStart(2, '0')}：${s.name}（${z.name}）`;
    updateAiContext();
    showDetail({
        badge: `${kvCode(z.name) || ''} · 点位 ${String(s.no).padStart(2, '0')}`,
        title: s.name,
        img: s.img,
        audio: s.audio,
        desc: s.desc
    });
}

function showDetail(o) {
    document.getElementById('detail-badge').innerText = o.badge;
    document.getElementById('detail-title').innerText = o.title;

    const descEl = document.getElementById('detail-desc');
    descEl.innerHTML = String(o.desc || '')
        .split(/\n+/).filter(Boolean)
        .map(p => `<p>${esc(p)}</p>`).join('');

    setDetailPhoto(o.img, o.title);
    loadAudio(o.audio);

    document.getElementById('detail-modal').classList.add('show');
    document.querySelector('.detail-body').scrollTop = 0;
}

function closeDetail() {
    document.getElementById('detail-modal').classList.remove('show');
    player.pause();
    currentContext = '导览首页';
    updateAiContext();
}

/* 有图显示，无图占位 */
function setDetailPhoto(src, name) {
    const img = document.getElementById('detail-img');
    const ph = document.getElementById('detail-photo-ph');
    const phT = document.getElementById('detail-photo-ph-text');
    const phP = document.getElementById('detail-photo-ph-path');

    img.style.display = 'none';
    ph.style.display = 'flex';
    phT.innerText = '以现场实景为准 · ' + (name || '');
    phP.innerText = src || '未配置路径';
    img.alt = name || '';

    img.onload = () => {
        if (img.naturalWidth > 10) { img.style.display = 'block'; ph.style.display = 'none'; }
    };
    img.onerror = () => {
        img.style.display = 'none'; ph.style.display = 'flex';
    };
    img.src = src || '';
    if (!src) { img.style.display = 'none'; }
}

function openMapZoom(src) {
    if (!src) return;
    document.getElementById('map-zoom-img').src = src;
    document.getElementById('map-zoom').classList.add('show');
}
function closeMapZoom() {
    document.getElementById('map-zoom').classList.remove('show');
    setTimeout(() => {
        if (!document.getElementById('map-zoom').classList.contains('show')) {
            document.getElementById('map-zoom-img').src = '';
        }
    }, 300);
}

/* ============ 音频播放 ============ */
const SPEEDS = [1.0, 1.5, 2.0, 0.8];
const SPEED_TXT = ['1.0x', '1.5x', '2.0x', '0.8x'];
let speedIdx = 0;

const player = document.getElementById('global-player');
const playBtn = document.getElementById('play-btn');
const progress = document.getElementById('audio-progress');
const timeText = document.getElementById('audio-time');
const speedBtn = document.getElementById('speed-btn');

function loadAudio(src) {
    player.pause();
    playBtn.innerText = '▶';
    progress.style.width = '0%';
    timeText.innerText = '00:00 / 00:00';
    player.src = src || '';
    player.playbackRate = SPEEDS[speedIdx];
    playBtn.disabled = !src;
}

function toggleAudio() {
    if (!player.src) return;
    if (player.paused) {
        player.play().then(() => { playBtn.innerText = '⏸'; })
            .catch(() => { playBtn.innerText = '▶'; });
    } else {
        player.pause();
        playBtn.innerText = '▶';
    }
}

function cycleSpeed(e) {
    e.stopPropagation();
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    player.playbackRate = SPEEDS[speedIdx];
    speedBtn.innerText = SPEED_TXT[speedIdx];
}

player.addEventListener('play', () => playBtn.innerText = '⏸');
player.addEventListener('pause', () => playBtn.innerText = '▶');
player.addEventListener('ended', () => { playBtn.innerText = '▶'; progress.style.width = '0%'; });
player.addEventListener('timeupdate', () => {
    if (!player.duration) return;
    progress.style.width = (player.currentTime / player.duration * 100) + '%';
    timeText.innerText = fmt(player.currentTime) + ' / ' + fmt(player.duration);
});
player.addEventListener('loadedmetadata', () => {
    timeText.innerText = '00:00 / ' + fmt(player.duration);
});
player.addEventListener('error', () => {
    playBtn.disabled = true;
    timeText.innerText = '音频未找到';
});

function fmt(s) {
    if (!isFinite(s)) return '00:00';
    const m = Math.floor(s / 60), ss = Math.floor(s % 60);
    return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
}

function seekAudio(e) {
    if (!player.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
    player.currentTime = ratio * player.duration;
}

/* ============ AI 悬浮面板（接口 /api/chat） ============ */
let eventSource = null;
let aiBusy = false;
let currentContext = '导览首页';

function toggleAiPanel(force) {
    const panel = document.getElementById('ai-panel');
    const show = typeof force === 'boolean' ? force : !panel.classList.contains('show');
    panel.classList.toggle('show', show);
    if (show) setTimeout(() => document.getElementById('user-question').focus(), 260);
}

function updateAiContext() {
    document.getElementById('ai-context').innerText = '当前浏览：' + currentContext;
}

function handleKeyPress(e) {
    if (e.key === 'Enter') askPharaoh();
}

function appendMsg(role, text) {
    const body = document.getElementById('ai-body');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<span>' + text + '</span>';
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    return div.querySelector('span');
}

function askPharaoh() {
    if (aiBusy) return;
    const input = document.getElementById('user-question');
    const btn = document.getElementById('ask-btn');
    const question = input.value.trim();
    if (!question) return;

    if (eventSource) { eventSource.close(); eventSource = null; }

    input.value = '';
    input.disabled = true;
    btn.disabled = true;
    aiBusy = true;

    appendMsg('user', question);
    const aiSpan = appendMsg('ai', '⏳ 法老正拨开三千年的风沙，在泥板上翻阅史料...');

    let fullAnswer = '';
    const ctx = currentContext !== '导览首页' ? `当前游客在：${currentContext}。问题是：` : '';
    const url = `/api/chat?question=${encodeURIComponent(ctx + question)}`;
    eventSource = new EventSource(url);

    eventSource.addEventListener('conversation.message.delta', function (e) {
        try {
            const obj = JSON.parse(e.data);
            if (obj.type === 'answer') {
                const chunk = obj.content || obj.reasoning_content || '';
                if (chunk) {
                    fullAnswer += chunk;
                    aiSpan.innerHTML = fullAnswer;
                    const body = document.getElementById('ai-body');
                    body.scrollTop = body.scrollHeight;
                }
            }
        } catch (err) { /* 忽略解析失败的分片 */ }
    });

    eventSource.addEventListener('conversation.chat.completed', safeClose);
    eventSource.addEventListener('conversation.chat.failed', function () {
        aiSpan.innerHTML = '神殿算力已耗尽，请稍后再向我发问。';
        safeClose();
    });
    eventSource.onerror = function () {
        aiSpan.innerHTML = '法老正在神殿沉睡，恢复网络后再来打扰吧。';
        safeClose();
    };

    function safeClose() {
        if (eventSource) { eventSource.close(); eventSource = null; }
        input.disabled = false;
        btn.disabled = false;
        aiBusy = false;
    }
}

/* ============ 初始化 ============ */
document.addEventListener('DOMContentLoaded', () => {
    renderList();
    updateAiContext();
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if (document.getElementById('map-zoom').classList.contains('show')) closeMapZoom();
            else if (document.getElementById('detail-modal').classList.contains('show')) closeDetail();
            else toggleAiPanel(false);
        }
    });
});
